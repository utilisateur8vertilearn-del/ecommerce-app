# CI — Intégration Continue
# Déclenché à chaque push sur main et à chaque pull request ciblant main.
# Deux jobs :
#   1) build-test : restaure, compile et (placeholder) teste la solution .NET.
#   2) security-scan : scanne le dépôt avec Trivy et bloque si faille CRITICAL/HIGH.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule un run précédent encore en cours sur la même réf (économie de minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt.
      - name: Checkout
        uses: actions/checkout@v4

      # Installe le SDK .NET 10 (le projet cible net10.0).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restaure les dépendances NuGet de toute la solution.
      - name: Restore
        run: dotnet restore ECommerce.slnx

      # Compile en Release sans refaire la restauration.
      - name: Build
        run: dotnet build ECommerce.slnx --configuration Release --no-restore

      # Lance les tests. NOTE : aucun projet de test n'existe encore dans la
      # solution ; cette étape ne fait donc rien pour l'instant et sert de
      # placeholder. Dès qu'un projet *.Tests sera ajouté, il sera exécuté ici.
      - name: Test
        run: dotnet test ECommerce.slnx --configuration Release --no-build --verbosity normal

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scan en mode "filesystem" (pas d'image Docker : le projet tourne via
      # .NET Aspire, sans conteneur). Trivy inspecte le code et les dépendances.
      # exit-code 1 + severity CRITICAL,HIGH => la chaîne ÉCHOUE si une faille
      # critique ou haute corrigeable est détectée.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
